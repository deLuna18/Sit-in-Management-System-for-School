<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f7fc;
        }

        /* NAVIGATION BAR */
        .navbar {
            width: 100%;
            background-color: #0D6EFD;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .nav-items {
            display: flex;
        }

        .navbar .nav-link {
            color: white;
            font-weight: bold;
            margin: 0 10px;
            text-decoration: none;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s ease-in-out;
        }

        .navbar .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* MAIN CONTAINER */
        .container {
            display: flex;
            flex-direction: row;
            width: 90%;
            max-width: 900px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            margin-top: 80px;
        }

        /* LEFT SECTION */
        .left-section {
            width: 40%;
            background: #0D6EFD;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: white;
            text-align: center;
        }

        .left-section img {
            width: 80%;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* RIGHT SECTION */
        .right-section {
            width: 60%;
            padding: 40px;
            background: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            color: #0D6EFD;
            font-weight: bold;
        }

        /* FORM DESIGN */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s ease-in-out;
        }

        input:focus {
            border: 1px solid #0D6EFD;
            outline: none;
            box-shadow: 0px 0px 5px rgba(13, 110, 253, 0.3);
        }

        /* RESERVE BUTTON */
        .reserve-btn {
            width: 100%;
            background: #0D6EFD;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease-in-out;
        }

        .reserve-btn:hover {
            background: #0A58CA;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 95%;
            }

            .left-section, .right-section {
                width: 100%;
                padding: 30px;
            }

            .left-section img {
                width: 60%;
            }
        }

    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <a class="nav-link" href="{{ url_for('student_dashboard')}}">Dashboard</a>
        <div class="nav-items">
            <a class="nav-link" href="{{ url_for('student_dashboard')}}">Home</a>
            <a class="nav-link" href="#">Notifications</a>
            <a class="nav-link" href="{{ url_for('edit_profile') }}">Profile</a>
            <a class="nav-link" href="{{ url_for('student_history')}}">History</a>
            <a class="nav-link" href="{{ url_for('student_reservation')}}">Reservation</a>
            <a class="nav-link" href="{{ url_for('logout') }}">Log Out</a>
        </div>
    </nav>

    <!-- RESERVATION FORM CONTAINER -->
    <div class="container">
        <div class="left-section">
            <h2>Reserve a Slot</h2>
            <p>Fill out the form to book your reservation.</p>
            <img src="../static/images/reserve_enhanced.jpg" alt="Reservation Image">
        </div>
        <div class="right-section">
            <form method="POST" action="{{ url_for('student_reservation') }}">
                <div class="form-group">
                    <label>ID Number:</label>
                    <input type="text" name="idno" value="{{ student.idno }}" disabled>
                </div>
                <div class="form-group">
                    <label>Student Name:</label>
                    <input type="text" value="{{ student.firstname }} {{ student.middlename }} {{ student.lastname }}" disabled>
                </div>
                <div class="form-group">
                    <label>Course:</label>
                    <input type="text" name="course" value="{{ student.course }}" disabled>
                </div>
                <div class="form-group">
                    <label>Year Level:</label>
                    <input type="text" name="year_level" value="{{ student.year_level }}" disabled>
                </div>
                <div class="form-group">
                    <label>Purpose:</label>
                    <input type="text" name="purpose" placeholder="Enter purpose" required>
                </div>
                <div class="form-group">
                    <label>Lab:</label>
                    <input type="text" name="lab" placeholder="Enter Lab Number" required>
                </div>
                <div class="form-group">
                    <label>Time In:</label>
                    <input type="time" name="time_in" required>
                </div>
                <div class="form-group">
                    <label>Date:</label>
                    <input type="date" name="date" required>
                </div>
                <button type="submit" class="reserve-btn">Reserve</button>
            </form>
        </div>
    </div>

</body>
</html>
