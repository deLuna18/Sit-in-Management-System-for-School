<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background-color: #f4f6f9;
        }

        /* NAVIGATION BAR */
        .navbar {
            background-color: #0d6efd;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar .nav-items {
            display: flex;
            gap: 10px;
        }

        .navbar .nav-link {
            color: white;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s ease-in-out;
        }

        .navbar .navbar-brand {
            color: white;
            font-weight: 600;
            font-size: 1.6rem;
            text-decoration: none;
        }

        .navbar .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* MAIN CONTAINER */
        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 70px; 
        }

        /* Left Side - Form */
        .form-container {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            padding: 50px;
            box-shadow: 5px 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-wrapper {
            width: 80%; /* Increased size */
            max-width: 600px; /* Bigger form container */
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            color: #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-size: 15px;
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:disabled {
            background: #e9ecef;
            color: #555;
        }

        .reserve-btn {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 15px;
        }

        .reserve-btn:hover {
            background: #0056b3;
        }

        /* Right Side - Image */
        .image-container {
            width: 45%;
            background: url('../static/images/reserve_enhanced.jpg') no-repeat center;
            background-size: cover;
        }

        /* Responsive for Mobile */
        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
            }

            .form-container, .image-container {
                width: 100%;
                height: 50vh;
            }

            .navbar {
                flex-direction: column;
                align-items: center;
            }

            .navbar .nav-items {
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 10px;
            }

            .navbar .nav-link {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <a class="navbar-brand" href="{{ url_for('student_dashboard')}}">Dashboard</a>
        <div class="nav-items">
            <a class="nav-link" href="{{ url_for('student_dashboard')}}">Home</a>
            <a class="nav-link" href="#">Notifications</a>
            <a class="nav-link" href="{{ url_for('edit_profile') }}">Profile</a>
            <a class="nav-link" href="#">History</a>
            <a class="nav-link" href="#">Reservation</a>
            <a class="nav-link" href="{{ url_for('logout') }}">Log Out</a>
        </div>
    </nav>

    <div class="main-container">
        <!-- Left Side: Form -->
        <div class="form-container">
            <div class="form-wrapper">
                <h2>Reservation</h2>
                <form method="POST" action="{{ url_for('student_reservation') }}">
                    <div class="form-group">
                        <label>ID Number:</label>
                        <input type="text" name="idno" value="{{ student.idno }}" disabled>
                    </div>
                
                    <div class="form-group">
                        <label>Student Name:</label>
                        <input type="text" value="{{ student.firstname }} {{ student.middlename }} {{ student.lastname }}" disabled>
                    </div>
                
                    <div class="form-group">
                        <label>Course:</label>
                        <input type="text" name="course" value="{{ student.course }}" disabled>
                    </div>
                
                    <div class="form-group">
                        <label>Year Level:</label>
                        <input type="text" name="year_level" value="{{ student.year_level }}" disabled>
                    </div>
                
                    <div class="form-group">
                        <label>Purpose:</label>
                        <input type="text" name="purpose" placeholder="Enter purpose (e.g., C Programming)" required>
                    </div>
                
                    <div class="form-group">
                        <label>Lab:</label>
                        <input type="text" name="lab" placeholder="Enter Lab Number" required>
                    </div>
                
                    <div class="form-group">
                        <label>Time In:</label>
                        <input type="time" name="time_in" required>
                    </div>
                
                    <div class="form-group">
                        <label>Date:</label>
                        <input type="date" name="date" required>
                    </div>
                
                    <button type="submit" class="reserve-btn">Reserve</button>
                </form>                
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="image-container"></div>
    </div>

</body>
</html>
